[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-king-admin-backend"
version = "0.1.0"
description = "FastAPI admin backend for Ticket King"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "psycopg[binary]",
  "pydantic-settings",
  "uvicorn[standard]",
]
