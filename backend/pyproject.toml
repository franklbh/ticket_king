[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-king-backend"
version = "0.1.0"
description = "FastAPI backend for Ticket King"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "pydantic-settings",
  "uvicorn[standard]",
  "httpx",
  "cryptography",
  "stripe",
]
